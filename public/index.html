<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Genius Brain – Autonomous Growth Engine</title>
  <style>
    :root { --bg:#0a0b10; --surface:#131622; --border:#262a3a; --text:#e1e4f0; --accent:#7c6ff7; --green:#00d4aa; }
    body { margin:0; padding:24px; font-family:system-ui; background:var(--bg); color:var(--text); }
    .container { max-width:900px; margin:auto; }
    h1 { background:linear-gradient(135deg,#7c6ff7,#00d4aa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:2.5rem; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px; margin:20px 0; }
    input, select { padding:12px; background:#1c1f2c; border:1px solid var(--border); border-radius:10px; color:#fff; width:100%; font-size:1rem; margin:8px 0; }
    .btn { padding:14px 28px; background:var(--accent); border:none; border-radius:12px; font-weight:600; cursor:pointer; color:#fff; font-size:1rem; }
    .btn:hover { opacity:0.9; }
    .log-box { background:#0c0e17; border-radius:10px; padding:16px; height:260px; overflow-y:auto; font-family:monospace; font-size:0.9rem; }
    .progress-bar { height:6px; background:#1c1f2c; border-radius:6px; margin:12px 0; overflow:hidden; }
    .progress-fill { height:100%; background:var(--accent); width:0%; transition:width 0.5s; }
    .badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:0.8rem; font-weight:600; text-transform:uppercase; }
    .hidden { display:none; }
    .report-box { background:#0c0e17; border-radius:10px; padding:16px; white-space:pre-wrap; max-height:400px; overflow-y:auto; font-family:monospace; }
  </style>
</head>
<body>
<div class="container">
  <h1>🧠 Genius SEO & AEO Brain</h1>
  <p style="color:#9ca3b8;">Autonomous code optimization, entity‑rich content, and answer‑engine ranking in one click.</p>

  <div class="card" id="setupCard">
    <h3>1. Connect Your GitHub Repository</h3>
    <input type="url" id="repoInput" placeholder="https://github.com/your-username/website.git">
    <label style="display:flex; align-items:center; gap:8px;">
      <input type="checkbox" id="mergeCheckbox"> Auto‑merge to main (instant deployment)
    </label>
    <button class="btn" id="startBtn">⚡ Activate Genius Brain</button>
  </div>

  <div class="card hidden" id="progressCard">
    <h3>2. Live Progress</h3>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span class="badge" id="statusBadge">Thinking...</span>
    <div class="log-box" id="logBox"></div>
    <div id="resultBox" class="hidden" style="margin-top:16px;"></div>
  </div>

  <div class="card hidden" id="reportCard">
    <h3>🧾 Genius Strategic Report</h3>
    <div class="report-box" id="reportContent"></div>
  </div>
</div>

<script>
  let eventSource;
  document.getElementById('startBtn').addEventListener('click', async () => {
    const repoUrl = document.getElementById('repoInput').value.trim();
    const merge = document.getElementById('mergeCheckbox').checked;
    if (!repoUrl.includes('github.com')) return alert('Enter a valid GitHub repo URL');
    document.getElementById('setupCard').classList.add('hidden');
    document.getElementById('progressCard').classList.remove('hidden');
    document.getElementById('reportCard').classList.add('hidden');
    document.getElementById('logBox').innerHTML = '';
    document.getElementById('progressFill').style.width = '0%';
    
    const res = await fetch('/api/optimize', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ repoUrl, mergeToMain: merge })
    });
    const { jobId } = await res.json();
    listenToJob(jobId);
  });

  function listenToJob(jobId) {
    eventSource = new EventSource(`/api/job/${jobId}/stream`);
    eventSource.addEventListener('progress', (e) => {
      const d = JSON.parse(e.data);
      document.getElementById('statusBadge').textContent = d.status;
      if (d.log) {
        document.getElementById('logBox').innerHTML += `<div>${d.log}</div>`;
        document.getElementById('logBox').scrollTop = document.getElementById('logBox').scrollHeight;
      }
      const fill = document.getElementById('progressFill');
      if (d.status === 'cloning') fill.style.width = '15%';
      else if (d.status === 'analyzing') fill.style.width = '45%';
      else if (d.status === 'applying') fill.style.width = '75%';
      else if (d.status === 'committing') fill.style.width = '90%';
      else if (d.status === 'done') fill.style.width = '100%';
    });
    eventSource.addEventListener('complete', (e) => {
      const d = JSON.parse(e.data);
      eventSource.close();
      if (d.status === 'done') {
        document.getElementById('statusBadge').textContent = 'Completed';
        document.getElementById('progressFill').style.width = '100%';
        let msg = `<p>✅ Branch <strong>${d.result.branch || 'none'}</strong> pushed.</p>`;
        if (d.result.merged) msg += '<p style="color:#00d4aa;">🚀 Merged to main – your live site is now optimized!</p>';
        msg += `<p>📄 <a href="#" onclick="showReport()">View the strategic report</a></p>`;
        document.getElementById('resultBox').innerHTML = msg;
        document.getElementById('resultBox').classList.remove('hidden');
        if (d.result.report) {
          document.getElementById('reportContent').textContent = d.result.report;
          window._report = d.result.report;
        }
      } else {
        document.getElementById('logBox').innerHTML += `<div style="color:#f44;">❌ ${d.error}</div>`;
      }
    });
  }

  function showReport() {
    if (window._report) {
      document.getElementById('reportCard').classList.remove('hidden');
      document.getElementById('reportContent').textContent = window._report;
      document.getElementById('reportCard').scrollIntoView({behavior:'smooth'});
    }
  }
</script>
</body>
</html>
